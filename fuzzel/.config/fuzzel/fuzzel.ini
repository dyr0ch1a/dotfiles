[main]
font=monospace:size=16
dpi-aware=no
prompt="> "
lines=15
vertical-pad=8
inner-pad=4
image-size-ratio=0.5
show-actions=yes
terminal=kitty -e
exit-on-keyboard-focus-loss=yes

[colors]
background=0d0d0dff
text=e0e0e0ff
match=cc007aff
selection=1a001aff
selection-text=f0f0f0ff
selection-match=ff00aaff
border=99005aff

[border]
width=2
radius=8

[dmenu]
exit-immediately-if-empty=yes
include=/home/dyr0ch1a/.config/fuzzel/themes/noctalia
